# Copy to users.yaml and chmod 600 it -- it holds password hashes, not plain
# text, but treat it like config.yaml anyway: keep it out of git (already in
# .gitignore) and off shared disks.
#
# Do not hand-edit password hashes. Add or change a user with:
#
#   python auth.py --users users.yaml --add-user alice --role operator
#   python auth.py --users users.yaml --add-user acme-corp --role client
#
# Roles:
#   operator  full access -- Review, Live with recording, Dataset audit.
#   client    read-only -- Live (no recording toggle), Sightings, Species.
#             Every mutating API in this app refuses a client-role session,
#             regardless of what the page in front of them shows.
#
# This file is created empty; the two lines below are only here to show the
# shape apply once real users are added with the command above.
users: {}
