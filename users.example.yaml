# Copy this file to users.yaml, then chmod 600 it -- it holds password
# hashes (never plain text passwords), but treat it like config.yaml anyway:
# keep it out of git (already in .gitignore) and off shared disks.
#
# Don't edit this file by hand. Create each login with this command instead
# (it hashes the password and writes it in):
#
#   python backend/auth.py --users users.yaml --add-user alice --role operator
#
# Two roles:
#   operator  full access: Review, Live (with recording), Dataset audit.
#   client    read-only: Live (no recording), Sightings, Species.
#
# This file starts empty (`users: {}`) -- add your first login with the
# command above and it fills itself in.
users: {}
