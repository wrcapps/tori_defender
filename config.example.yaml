# Copy this file to config.yaml, fill in the fields marked "EDIT THIS", then:
#   chmod 600 config.yaml
# config.yaml holds your camera passwords, so it must never be committed to
# git (it's already in .gitignore -- keep it that way).

# EDIT THIS. A short lowercase name for this location, e.g. corbu, babadag.
# It decides where this site's data is saved: sites/<site>/...
# Two installations must never share a site name, or one would silently write
# into the other's data.
site: corbu

model:
  # EDIT THIS. Path to the trained detection model (given to you separately).
  weights: weights/best.pt

capture:
  # Only needed if a camera is physically mounted rotated and can't fix that
  # itself. none | ccw | cw
  rotate: none

# Login for every camera below, unless a camera overrides it (see the
# commented-out example at the bottom of `cameras:`).
defaults:
  # EDIT THIS. The camera's own login, not this app's users.yaml login.
  username: admin
  password: CHANGE_ME

  # The camera's main (not "sub") stream. {host} is replaced per camera below.
  # Leave this alone unless your cameras use a different RTSP path.
  record_url: "rtsp://{host}:554/Streaming/Channels/101"

  # -------------------------------------------------------------------------
  # Advanced: how densely a camera is scanned/recorded. Leave these as they
  # are unless you were told to change them for a specific site. Applies to
  # every camera; a single camera can override any of these (see `cameras:`
  # below).
  # -------------------------------------------------------------------------
  # live:
  #   scan_fps: 1.0            # frames/sec checked while idle (per-camera GPU cost)
  #   save_fps: 4.0            # frames/sec saved once something is detected
  #   infer_every_n: 4         # run the model every Nth saved frame
  #   cooldown_seconds: 8.0    # quiet time before a recording stops
  #   max_window_seconds: 120.0 # longest a single recording can run
  #   conf: 0.25               # detection confidence floor
  #   preview_fps: 6.0         # how often the Live view's picture refreshes
  #   preview_width: 1280      # size of the Live view's preview image
  #   jpeg_quality: 95         # quality of saved frames

# EDIT THIS. One entry per camera. `name` becomes part of file/folder names,
# so keep it to letters, digits, dot, dash, underscore.
cameras:
  - name: corbu-1
    host: 192.0.2.10

  # - name: mast2-a
  #   host: 192.168.88.41
  #   username: other-login      # overrides `defaults:` for this camera only
  #   password: other-password
  #   live:
  #     scan_fps: 0.5           # overrides `defaults: live:` for this camera only

# Optional, advanced: only used if a site's network link is worth watching
# separately (e.g. a WireGuard tunnel). Leave unset otherwise -- it has no
# effect if absent.
# link_watch_csv: ../link_watch.csv
