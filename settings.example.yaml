# Per-installation choices, normally written by the app's Settings page / first-run setup.
# Copy to settings.yaml to preset them; with no settings.yaml the app starts the first-run setup.
model: null         # a file in models/ (null = whatever config.yaml says)
data_dir: null      # the ARCHIVE (the NAS), e.g. /mnt/Tori/BirdReviewApp: confirmed windows and negatives older than
                    # 24 h are moved there in the background. null = keep everything under <app>/sites.
                    # Capture and review always work on the local <app>/sites and never wait for it.
setup_done: false
